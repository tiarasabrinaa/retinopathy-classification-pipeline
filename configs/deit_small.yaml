# DeiT-Small fine-tuning config.
# Model id from timm: https://huggingface.co/timm/deit_small_patch16_224.fb_in1k
model_name: deit_small_patch16_224
num_classes: 4
image_size: 224
seed: 42

train_csv: dataset_splits/train.csv
val_csv: dataset_splits/val.csv
test_csv: dataset_splits/test.csv
class_names_json: dataset_splits/class_names.json
batch_size: 32
num_workers: 4

# weight_decay = 0.05 genuinely matches DeiT's own fine-tuning stage
# (Touvron et al. 2021, Table 9) -- unlike ConvNeXt, DeiT doesn't reduce
# weight decay for fine-tuning. Caveat: DeiT's "fine-tuning" there means
# fine-tuning at a higher resolution on the *same* ImageNet dataset, not
# transfer to a new dataset like ours, so it's the closest available
# precedent rather than a value validated for this exact use case.
# Kept identical to the ConvNeXt config's weight_decay on purpose (even
# though ConvNeXt's own fine-tuning recipe actually uses 1e-8 -- see the
# comment in configs/convnext_tiny.yaml), so the head-to-head comparison
# isn't confounded by different regularization strength.
# label_smoothing = 0.1 matches DeiT Table 9 exactly (both training stages).
weight_decay: 0.05
label_smoothing: 0.1

# Phase 1: backbone frozen, only the classifier head trains.
linear_probe_epochs: 5
linear_probe_lr: 1.0e-3

# Phase 2: every parameter trains, low LR + cosine decay.
finetune_epochs: 25
finetune_lr: 5.0e-5

checkpoint_dir: checkpoints/deit_small
run_name: deit_small_finetune
